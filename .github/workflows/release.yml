name: Build & Release Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            flag: --win --x64
          - os: ubuntu-latest
            platform: linux
            flag: --linux
          - os: macos-latest
            platform: mac
            flag: --mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Package Electron application (${{ matrix.platform }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx electron-builder ${{ matrix.flag }} --publish never

      - name: Upload built executables
        uses: actions/upload-artifact@v4
        with:
          name: executables-${{ matrix.platform }}
          path: |
            dist-exe/*.exe
            dist-exe/*.AppImage
            dist-exe/*.deb
            dist-exe/*.dmg
            dist-exe/*.zip
            !dist-exe/*unpacked*
            !dist-exe/*.blockmap

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all built executables
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach executables to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
